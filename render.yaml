# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the WhoOwes API (web service). The database is MongoDB Atlas (free cluster).
# Values marked `sync: false` are asked for when you create the Blueprint.

services:
  - type: web
    name: whoowes-api
    runtime: node
    rootDir: server
    plan: free # sleeps after 15 min idle; the first request after that takes about a minute. Upgrade later: 0.5c-512mb.
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas → your cluster → Connect → Drivers → connection string
      # (mongodb+srv://…), with your database user's password filled in.
      - key: MONGODB_URI
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      # Phone sign-in codes (Twilio Console → Verify → Services)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      # AI receipt reading (console.anthropic.com → API keys)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Rewarded ads: "true" once AdMob server-side verification points at /ai/ad/ssv.
      - key: ADMOB_SSV_REQUIRED
        value: "false"
      # Sign-in for Google Play / App Store reviewers (a number + 6-digit code you choose).
      - key: REVIEW_PHONE
        sync: false
      - key: REVIEW_CODE
        sync: false
      # Shown on /privacy, /terms and /delete-account.
      - key: SUPPORT_EMAIL
        sync: false
